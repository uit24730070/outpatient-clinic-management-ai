# Phục vụ SPA tĩnh + reverse proxy các lời gọi API tới dịch vụ backend ("api").
# Nhờ proxy same-origin, trình duyệt không cần CORS và apiClient dùng URL tương đối.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: mọi route không khớp file tĩnh → index.html (react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Chuyển tiếp API và health-check sang backend (tên dịch vụ trong docker network).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8080;
    }
}
